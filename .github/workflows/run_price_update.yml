name: Price Update Every 5 Min (Market Hours)

on:
  schedule:
    - cron: '35,40,45,50,55 13 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 14 * * 1-5'
    - cron: '0,5,10,15,20,25,30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run price update
        run: python price_update.py
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add options_v3_results.csv
          git diff --cached --quiet || git commit -m "Price update: $(date -u '+%H:%M UTC')"
          git push
