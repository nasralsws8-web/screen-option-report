name: Stock Pre-Breakout Scan

on:
  schedule:
    # بريماركت حتى منتصف الجلسة (صيفاً UTC): 4:00–12:00 ET
    - cron: '*/15 8-15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: repo-csv-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test pre-breakout rules
        run: python -m unittest tests.test_prebreakout -v

      - name: Scan stocks
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python stock_prebreakout_scan.py

      - name: Commit results
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "Stock pre-breakout: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            stock_prebreakout.csv
