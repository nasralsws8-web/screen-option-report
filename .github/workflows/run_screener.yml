name: Options Screener Daily Run

on:
  schedule:
    # كل يوم عمل الساعة 3:00 مساءً بتوقيت الرياض = قبل فتح السوق بساعة ونص (12:00 UTC)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:  # تشغيل يدوي من GitHub عند الحاجة

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python cheap_options_screener_v3.py

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options_v3_results.csv
          git diff --cached --quiet || git commit -m "📊 Auto update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Send email notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "📊 Options Screener — النتائج جاهزة $(date '+%Y-%m-%d')"
          to: nasralsws8@gmail.com
          from: Options Screener Bot
          body: |
            السلام عليكم ناصر،

            النتائج اليومية جاهزة الحين!

            افتح Claude وقول: "حلل النتائج"

            رابط الريبو:
            https://github.com/nasralsws8-web/screen-option-report
