name: Options Screener Full Scan (Market Open)

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: screener-full
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          SCREENER_SOURCE: both
        run: python cheap_options_screener_v3.py

      - name: Run outcome tracker
        run: python outcome_tracker.py


      - name: Send Telegram notifications
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Commit results to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options_v3_results.csv outcomes.csv
          git diff --cached --quiet || git commit -m "Auto update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
