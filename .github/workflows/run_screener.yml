name: Options Screener Full Scan (9:45 ET / 4:45 Saudi)

on:
  schedule:
    # 13:45 UTC ≈ 9:45 AM ET ≈ 4:45 PM Saudi — بعد ضوضاء الافتتاح
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

concurrency:
  group: repo-csv-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          SCREENER_SOURCE: both
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python cheap_options_screener_v3.py

      - name: Run outcome tracker
        run: python outcome_tracker.py

      - name: Send Telegram notifications
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Commit results to repo
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "Auto update: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            options_v3_results.csv outcomes.csv
