name: Options Screener Full Scan (every 15m market hours)

on:
  schedule:
    # أول ساعة بعد الافتتاح: كل 5 د (صيفاً 13:00–13:55 UTC ≈ 9:00–9:55 ET)
    - cron: '*/5 13 * * 1-5'
    # باقي الجلسة كل ربع ساعة (14:00–19:45 UTC ≈ 10:00 AM–3:45 PM ET)
    - cron: '*/15 14-19 * * 1-5'
    # رن إغلاق 20:00 UTC
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

concurrency:
  # نفس مجموعة كتّاب CSV (مع price_update / EOD) — يمنع سباق الكتابة على النتائج
  group: repo-csv-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gate tests
        run: python -m unittest tests.test_gates tests.test_theta_eod tests.test_push_csv_changes -v

      - name: Run screener
        env:
          SCREENER_SOURCE: both
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python cheap_options_screener_v3.py

      - name: Run outcome tracker
        run: python outcome_tracker.py

      - name: Gemini advisor (BUY/WAIT notes only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY missing — skip advisor"
            exit 0
          fi
          echo "Using GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite (default)}"
          python gemini_advisor.py || echo "Gemini advisor soft-failed (continuing)"

      - name: Send Telegram notifications
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_notify.py

      - name: Commit results to repo
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "Auto update: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            options_v3_results.csv outcomes.csv telegram_sent.json options_rejected_log.csv
