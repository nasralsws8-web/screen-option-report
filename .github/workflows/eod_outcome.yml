name: EOD Outcome Tracker (After Market Close)

on:
  schedule:
    # Mon-Fri after US close (EDT = UTC-4 → 4:00 PM ET = 20:00 UTC)
    - cron: '30 20 * * 1-5'   # 4:30 PM ET — أول تحديث بعد الإغلاق
    - cron: '30 21 * * 1-5'   # 5:30 PM ET — شمعة اليوم مكتملة
  workflow_dispatch:

concurrency:
  group: eod-outcome
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update outcomes after market close
        env:
          EOD_RUN: 'true'
        run: python outcome_tracker.py

      - name: Commit outcomes.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outcomes.csv
          git diff --cached --quiet || git commit -m "EOD outcomes: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push
