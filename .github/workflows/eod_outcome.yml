name: EOD Outcome Tracker (After Market Close)

on:
  schedule:
    # Mon-Fri after US close (EDT = UTC-4 → 4:00 PM ET = 20:00 UTC)
    - cron: '30 20 * * 1-5'   # 4:30 PM ET — أول تحديث بعد الإغلاق
    - cron: '30 21 * * 1-5'   # 5:30 PM ET — شمعة اليوم مكتملة
  workflow_dispatch:

concurrency:
  group: repo-csv-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java (Theta Terminal for EOD option closes)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Theta Terminal
        env:
          THETA_EMAIL: ${{ secrets.THETA_EMAIL }}
          THETA_PASSWORD: ${{ secrets.THETA_PASSWORD }}
        run: bash .github/scripts/start_theta_terminal.sh

      - name: Update outcomes after market close
        env:
          EOD_RUN: 'true'
          THETA_EMAIL: ${{ secrets.THETA_EMAIL }}
        run: python outcome_tracker.py

      - name: Days → ledger → verified / failed / waiting notes
        run: python session_note.py --no-vault

      - name: Commit outcomes.csv
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "EOD outcomes: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            outcomes.csv sessions/
