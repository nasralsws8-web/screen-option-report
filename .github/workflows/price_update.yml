name: Price Update (Every 15 min during market hours)

on:
  schedule:
    # Mon-Fri 13:30 - 19:45 UTC (9:30 AM - 3:45 PM ET) every 15 minutes
    - cron: '*/15 13-19 * * 1-5'
    - cron: '0 20 * * 1-5'   # Final update at market close 4 PM ET
  workflow_dispatch:

concurrency:
  group: repo-csv-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market scan (Finviz + manual)
        env:
          SCREENER_SOURCE: both
        run: python price_update.py

      - name: Run outcome tracker
        run: python outcome_tracker.py

      - name: Commit updated CSVs
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "Price update: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            options_v3_results.csv outcomes.csv
