name: Price Update (Every 5 min during market hours)

# ملاحظة: GitHub Actions لا يضمن جدولة كل دقيقة (الحد العملي ≈ 5 دقائق).
# لتحديث كل دقيقة ثابت: شغّل scripts/vps_minute_update.sh على VPS.
on:
  schedule:
    # بعد المسح الكامل 13:45 UTC — تحديث كل 5 دقائق حتى إغلاق السوق
    - cron: '*/5 14-19 * * 1-5'
    - cron: '0 20 * * 1-5'   # Final update at market close 4 PM ET
  workflow_dispatch:

concurrency:
  group: repo-csv-writes
  # false: لا نلغي المسح الكامل / EOD إذا تداخلا مع تحديث السعر
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market scan (Finviz + manual)
        env:
          SCREENER_SOURCE: both
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python price_update.py

      - name: Run outcome tracker
        run: python outcome_tracker.py

      - name: Commit updated CSVs
        run: |
          bash .github/scripts/push_csv_changes.sh \
            "Price update: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            options_v3_results.csv outcomes.csv
